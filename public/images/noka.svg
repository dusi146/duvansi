<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <radialGradient id="n-stage" cx="65%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#262e20"/>
      <stop offset="52%" stop-color="#111610"/>
      <stop offset="100%" stop-color="#070907"/>
    </radialGradient>
    <radialGradient id="n-halo" cx="72%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#d5ff4f" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#9cb080" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9cb080" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="n-bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4e8" stop-opacity="0.88"/>
      <stop offset="28%" stop-color="#b9c69f" stop-opacity="0.78"/>
      <stop offset="65%" stop-color="#6b7a53" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#28311e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="n-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141911"/>
      <stop offset="40%" stop-color="#47523b"/>
      <stop offset="100%" stop-color="#0e120c"/>
    </linearGradient>
    <pattern id="n-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e2e8d8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="780" fill="url(#n-stage)"/>
  <rect width="1200" height="780" fill="url(#n-grid)"/>
  <rect width="1200" height="780" fill="url(#n-halo)"/>

  <!-- Botanical Optical Rings -->
  <g transform="translate(815 390)" fill="none">
    <circle r="275" stroke="#d5ff4f" stroke-opacity="0.14"/>
    <circle r="215" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="4 8"/>
    <ellipse rx="240" ry="92" transform="rotate(-24)" stroke="#c5d1b0" stroke-opacity="0.24" stroke-width="1.2"/>
    <ellipse rx="240" ry="92" transform="rotate(36)" stroke="#d5ff4f" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- 3D Frosted Glass Serum Monolith -->
  <g transform="translate(715 148) rotate(6 100 240)">
    <rect x="58" y="-8" width="84" height="58" rx="8" fill="url(#n-cap)" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="36" y="44" width="128" height="70" rx="6" fill="url(#n-cap)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="8" y="106" width="184" height="356" rx="28" fill="url(#n-bottle)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="22" y="122" width="26" height="324" rx="12" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="34" y="182" width="132" height="196" rx="4" fill="#0d120b" fill-opacity="0.76" stroke="#d5ff4f" stroke-opacity="0.32"/>
    <text x="100" y="248" fill="#f3f6ec" font-family="Georgia, serif" font-size="48" text-anchor="middle" letter-spacing="-2">nōka</text>
    <line x1="56" y1="268" x2="144" y2="268" stroke="#d5ff4f" stroke-opacity="0.45"/>
    <text x="100" y="296" fill="#b7c2a6" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="2.5">BOTANICAL SERUM</text>
    <text x="100" y="318" fill="#8b967b" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="2">01 // CELLULAR CALM</text>
    <text x="100" y="354" fill="#d5ff4f" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1.5">50 ML — 1.69 FL.OZ</text>
  </g>

  <!-- Editorial Architecture Panel Left -->
  <g transform="translate(64 136)">
    <rect width="486" height="508" rx="4" fill="#0b0f0a" fill-opacity="0.62" stroke="#e2e8d8" stroke-opacity="0.14"/>
    <line x1="0" y1="54" x2="486" y2="54" stroke="#e2e8d8" stroke-opacity="0.1"/>
    <circle cx="26" cy="27" r="4" fill="#d5ff4f"/>
    <text x="44" y="31" fill="#a8b39b" font-family="monospace" font-size="11" letter-spacing="2.5">[ SYS.02 // DIGITAL FLAGSHIP ]</text>
    <text x="458" y="31" fill="#d5ff4f" font-family="monospace" font-size="11" text-anchor="end">2025</text>

    <text x="36" y="228" fill="#f2f5ec" font-family="Georgia, serif" font-size="138" letter-spacing="-6">nōka.</text>
    <text x="40" y="282" fill="#c2ceb0" font-family="Georgia, serif" font-style="italic" font-size="28">A quieter kind of beauty.</text>
    <text x="40" y="340" fill="#95a088" font-family="Arial, sans-serif" font-size="16">Tactile e-commerce architecture, spatial</text>
    <text x="40" y="366" fill="#95a088" font-family="Arial, sans-serif" font-size="16">product inspection &amp; ritual storytelling.</text>

    <line x1="36" y1="428" x2="450" y2="428" stroke="#e2e8d8" stroke-opacity="0.12"/>
    <text x="36" y="464" fill="#f2f5ec" font-family="monospace" font-size="11" letter-spacing="2">E-COMMERCE / ART DIRECTION</text>
    <text x="450" y="464" fill="#d5ff4f" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="end">STUDY 02 ↗</text>
  </g>

  <g fill="#8c9681" font-family="monospace" font-size="12" letter-spacing="2.5">
    <text x="64" y="56">NŌKA SKINCARE — EDITORIAL COMMERCE</text>
    <text x="1136" y="56" text-anchor="end">SENSORY // WEBGL</text>
    <text x="64" y="736">02 — MINIMALIST FORMULATION &amp; DIGITAL RITUAL</text>
    <text x="1136" y="736" fill="#d5ff4f" text-anchor="end">[ INTERACTIVE EDITION ]</text>
  </g>
</svg>
